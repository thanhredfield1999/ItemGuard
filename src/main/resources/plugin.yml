name: ItemGuard
version: 1.0.0
main: com.itemguard.ItemGuard
api-version: '1.21.11'
description: Anti-dupe item tracking with unique UUID, history, and GUI inspection
author: AI.WORK
website: https://github.com/aiwork-itemguard
softdepend: [WorldGuard]

commands:
  itemguard:
    description: ItemGuard main command
    usage: /<command> <check|history|search|stats|browser|reload|migrate>
    aliases: [ig]
  ig:
    description: ItemGuard alias command
    usage: /<command>
  igcheck:
    description: Check item in hand
    usage: /<command>
  ighistory:
    description: View item history
    usage: /<command> [page]
  igsearch:
    description: Search player items
    usage: /<command> <player>
    permission: itemguard.search
  igstats:
    description: View plugin statistics
    usage: /<command>
    permission: itemguard.stats
  finditem:
    description: Quan ly yeu cau tim vat pham theo ID
    usage: /<command> <startfinding|starttaking|stopfinding|listfinding|removefinding|clearfinding>
  matdo:
    description: Xem lich su va yeu cau ho tro lay lai vat pham
    usage: /<command> <check|sos>

permissions:
  itemguard.*:
    description: All ItemGuard permissions
    default: op
    children:
      itemguard.check: true
      itemguard.history: true
      itemguard.history.others: true
      itemguard.search: true
      itemguard.stats: true
      itemguard.restore: true
      itemguard.teleport: true
      itemguard.reload: true
      itemguard.migrate: true
      itemguard.gui: true
      itemguard.bypass: true
      itemguard.notify: true
      itemguard.finditem.admin: true
      itemguard.matdo: true
      itemguard.track: true
  itemguard.check:
    description: Check item UUID in hand
    default: true
  itemguard.history:
    description: View item transfer history
    default: true
  itemguard.history.others:
    description: View another player's history or query a direct item code
    default: op
  itemguard.search:
    description: Search items by player
    default: op
  itemguard.stats:
    description: View plugin statistics
    default: op
  itemguard.teleport:
    description: Teleport to a tracked item's container location from the timeline
    default: op
  itemguard.restore:
    description: Judge and carry out the restore of a destroyed item
    default: op
  itemguard.reload:
    description: Reload plugin configuration
    default: op
  itemguard.migrate:
    description: Dry-run or execute the SQLite to MySQL migration
    default: op
  itemguard.gui:
    description: Open history GUI
    default: op
  itemguard.bypass:
    description: Bypass anti-dupe checks (staff)
    default: op
  itemguard.notify:
    description: Receive duplicate/anti-dupe alerts in chat
    default: op
  itemguard.giveoldid:
    description: Return a proven-absent tracked item to its owner (/finditem giveoldid)
    default: op
  itemguard.finditem.admin:
    description: Quan ly /finditem
    default: op
  itemguard.matdo:
    description: Su dung /matdo check va /matdo sos
    default: true
  itemguard.track:
    description: Cho phep tracking khi WorldGuard support duoc bat
    default: op
