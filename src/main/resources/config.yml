# ============================================
#   ItemGuard Configuration
#   Anti-Dupe Item Tracking Plugin
#   Version: 1.0.0 | Minecraft 1.21.11
# ============================================

# ---------- GENERAL ----------
general:
  # Enable/disable the entire plugin
  enabled: true

  # Debug mode - prints verbose logging
  debug: false

  # Language: en, vi, zh, etc. (add to messages.yml)
  language: vi

# ---------- TRACKING ----------
tracking:
  # Enable/disable item tracking
  enabled: true

  # Track non-stackable items (swords, tools, armor, etc.)
  # Recommended: true (prevents duping exploits)
  track-non-stackable: true

  # Cancel a craft whose result would need a brand-new tracked identity (every tool, weapon and
  # armour piece). true keeps the plugin's original fail-closed behaviour: the craft does not
  # happen and the player is told why. Set it to false and the craft proceeds, with the identity
  # created at the next scan or pickup — the same "tag when it is seen" path a Spigot server
  # already uses. Nothing else changes either way: a crafted copy of an already-tagged item is
  # still refused.
  cancel-untracked-craft-output: true

  # Reserved compatibility key. UUID-per-item identity does not support
  # stackable materials safely; true is ignored and remains fail-closed.
  track-stackable: false

  # Materials to always track when they are non-stackable. Stackable
  # materials in this list are ignored by the identity safety policy.
  # Full administrators may opt in to the narrow LITE exclusions here.
  force-track-materials:
    - DIAMOND_SWORD
    - DIAMOND_PICKAXE
    - DIAMOND_AXE
    - DIAMOND_HOE
    - DIAMOND_SHOVEL
    - NETHERITE_SWORD
    - NETHERITE_PICKAXE
    - NETHERITE_AXE
    - NETHERITE_HOE
    - NETHERITE_SHOVEL
    - BOW
    - CROSSBOW
    - TRIDENT
    - SHIELD
    - ELYTRA
    - FISHING_ROD
    - SHEARS
    - FLINT_AND_STEEL
    - BRUSH
    - SPYGLASS
    - RECOVERY_COMPASS
    - BOOKSHELF
    - ANCIENT_DEBRIS
    - NETHERITE_INGOT
    - NETHERITE_HELMET
    - NETHERITE_CHESTPLATE
    - NETHERITE_LEGGINGS
    - NETHERITE_BOOTS
    - DIAMOND_HELMET
    - DIAMOND_CHESTPLATE
    - DIAMOND_LEGGINGS
    - DIAMOND_BOOTS
    - ENCHANTED_GOLDEN_APPLE
    - GOLDEN_APPLE
    - TOTEM_OF_UNDYING
    - NETHERITE_SCRAP
    - NETHERITE_UPGRADE_SMITHING_TEMPLATE
    - HEART_OF_THE_SEA
    - MUSIC_DISC_13
    - MUSIC_DISC_CAT
    - MUSIC_DISC_BLOCKS
    - MUSIC_DISC_CHIRP
    - MUSIC_DISC_FAR
    - MUSIC_DISC_MALL
    - MUSIC_DISC_MELLOHI
    - MUSIC_DISC_STAL
    - MUSIC_DISC_STRAD
    - MUSIC_DISC_WARD
    - MUSIC_DISC_11
    - MUSIC_DISC_WAIT
    - MUSIC_DISC_OTHERSIDE
    - MUSIC_DISC_PIGSTEP
    - COMPARATOR
    - REPEATER
    - DRAGON_HEAD
    - DRAGON_EGG
    - BEACON
    - CONDUIT
    - NETHER_STAR
    - SHULKER_BOX
    - SHULKER_BOX_WHITE
    - SHULKER_BOX_ORANGE
    - SHULKER_BOX_MAGENTA
    - SHULKER_BOX_LIGHT_BLUE
    - SHULKER_BOX_YELLOW
    - SHULKER_BOX_LIME
    - SHULKER_BOX_PINK
    - SHULKER_BOX_GRAY
    - SHULKER_BOX_LIGHT_GRAY
    - SHULKER_BOX_CYAN
