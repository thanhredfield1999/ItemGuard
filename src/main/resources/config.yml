    - SHULKER_BOX_BLACK

# ---------- UUID TAG DISPLAY ----------
uuid-tag:
  # Show a visible code tag on tracked items (in lore)
  # Set to false to disable lore tag completely
  # New code format: #XXXXXX (6 uppercase A-Z / 0-9 characters).
  # Public display code, not proof of uniqueness; DB reservation resolves collisions.
  # Existing code/UUID identities are not rewritten.
  show-on-item: true

  # Tag position in lore: 0 = first line, -1 = last line
  lore-position: -1

# ---------- ANTI-DUPE ----------
anti-dupe:
  # Detection, in one sentence: an identity observed in two or more distinct locations within the SAME
  # scan epoch (a player's inventory, an open container, a swept closed container), reported once that
  # epoch is complete. Carrying an item from one place to another between epochs is not a finding.
  #
  # The end-to-end path — two real stacks of one identity, seen by the scan, producing one confirmed
  # finding, one staff alert and one Discord payload, with nothing removed — is exercised by
  # tools/premium-runtime/premium_dupe_smoke.py on a controlled Paper/MySQL fixture; its receipt is
  # bound in run/ next to the other gates, along with what that gate does not cover.
  #
  # It still ships false: detection is the switch an owner turns on deliberately, after reading what
  # the gate proved and what it did not.
  enabled: false

  # MVP only permits NOTIFY. Destructive actions are fail-closed.
  action: NOTIFY

  # Notify online staff when duplicate is detected
  notify-staff: true

  # Notify the player holding the duplicated item
  notify-player: false

  # Cooldown (ms) between duplicate detections for same item
  # Prevents spam when duplicate spreads across multiple players
  # Must be at least TWO scan cycles (performance.inventory-scan-interval below), and values below
  # that are raised to it rather than silently doing nothing. One cycle is not enough: the window is
  # only meaningful against the real gap between two audits, and that gap is not the configured
  # cycle. A sweep that overruns, or a server below 20 TPS, makes it longer, so a one-cycle window
  # would suppress nothing exactly when it is needed. This value cannot be set to 0 to disable the
  # throttle; it is floored whatever the config says.
  detection-cooldown-ms: 300000

  # Maximum history entries per item before pruning
  max-history-per-item: 1000

  # Grace period (ms) after item creation before detection is active
  # Helps prevent false positives during item spawning
  grace-period-ms: 3000

  # Sweeps already-loaded chests, barrels, shulker boxes, hoppers, dispensers,
  # droppers and furnaces so two closed containers can be compared, not just an
  # open one. Never loads a chunk. Set to false for zero cost from this feature.
  sweep:
    enabled: true
    # Chunks scanned per tick while a sweep is in flight. Keep small; a busy
    # server can have thousands of loaded chunks.
    chunks-per-tick: 8

# ---------- DATABASE ----------
database:
  # Premium accepts MYSQL only after the complete Premium runtime gate is shipped.
  type: SQLITE

  # SQLite database file name
  sqlite:
    file-name: itemguard.db

  # Premium migration target. Keep credentials local; never commit this file with a password.
  mysql:
    url: ""
    user: ""
    password: ""

  # Connection pool settings
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 30000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000

# ---------- MULTI-SERVER (MySQL backend only) ----------
# Everything here is inert on SQLite: a single-server install has no second server to compare
# against, and the MySQL backend is the only one that can be shared. Nothing below changes the
# duplicate rule that LITE ships.
multi-server:
  # Name of THIS server, exactly as it appears in a cross-server finding. Readable names are the
  # point ("survival-1"): an operator reads it and knows where to look.
  # Letters, digits, dot, underscore and hyphen only, up to 64 characters; other values fail
  # startup rather than being printed into a finding. Blank means: use the name stored from an
  # earlier start, or generate one and store it.
  server-id: ""

  # Two sightings of one identity on two different servers within this many minutes are reported
  # as "seen on N servers". It is never reported as a duplicate: a legitimate move between servers
  # and a copy are indistinguishable from observation records alone, and the message says only
  # where the item was seen. Must be positive - a window of 0 is refused at startup instead of
  # being configured into silence.
  cross-server-window-minutes: 30

# ---------- GUI SETTINGS ----------
gui:
  # GUI title
  title: "&8&lItemGuard &7- &fLich Su Item"

  # Number of rows in the history GUI (1-6, 6 = max)
  history-rows: 5

  # Number of history entries per page in GUI
  entries-per-page: 45

  # Item display settings in GUI
  item-display:
    # Show item in history entry
    show-item: true

    # Show timestamp
    show-timestamp: true

    # Show location (world, x, y, z)
    show-location: true

    # Show action type
    show-action: true

    # Show player name
    show-player: true

  # GUI colors (use Minecraft color codes)
  colors:
    background: BLACK
    border: BLACK
    filler-item: GRAY_STAINED_GLASS_PANE
    next-page: ARROW
    prev-page: ARROW
    close-button: BARRIER

# ---------- COMMANDS ----------
commands:
  # Command aliases
  aliases:
    main: [itemguard, ig]
    check: [igcheck, igc]
    history: [ighist, igh]
    search: [igsearch, igs]
    stats: [igstats]

# ---------- RECLAIM ----------
reclaim:
  # /matdo check retention window.
  history-days: 20

  # Whether the plugin may actually issue an item back (/matdo sos, /finditem giveoldid).
  #
  # The transaction exists: a claim is armed (PENDING -> PREPARED) so the identity is locked while the
  # hand-over is in flight, the snapshot stack is written into the player's inventory on the server
  # thread, and the claim is then committed (delivered) or denied (retryable). Absence must still be
  # proven first — /matdo sos probes the player inventory, ender chest, PlayerVaults and zAuctionHouse,
  # and an adapter that is unavailable denies rather than counting as absent.
  #
  # It ships off because handing out items is the one action a server owner should switch on
  # deliberately, after a controlled runtime gate on their own Paper build. /matdo sos without it
  # answers that the gate is closed and leaves the claim denied — nothing is issued by default.
  # How to treat storage plugins that are not installed when proving absence.
  #
  # STRICT (default): every probe must prove absence. PlayerVaults/PlayerVaultsX and zAuctionHouse
  # deny even when installed, because no bounded read-only identity query proves absence in their
  # public APIs — so on a server that does not run them, every reclaim is refused. That is the safe
  # side and it is the shipped default.
  #
  # INSTALLED_ONLY: a plugin that is not installed is recorded as NOT_APPLICABLE in the claim's
  # evidence and skipped (it holds nothing to search), while any plugin that IS installed and cannot
  # be read still denies. Choose this only if you know your server does not keep items in those
  # plugins; the claim detail names every skipped source so the decision stays auditable.
  external-absence-mode: STRICT

  issuance-enabled: false

# ---------- LOGGING ----------
logging:
  # Log all item transfers to console
  log-to-console: true

  # Log level: ALL, INFO, WARNING, SEVERE, NONE
  console-level: INFO

  # Log duplicate detections
  log-duplicates: true

  # Log file settings
  file:
    enabled: true
    file-name: itemguard.log
    max-size-mb: 10
    max-files: 5

# ---------- PERFORMANCE ----------
performance:
  # Batch size for bulk database operations
  batch-size: 100

  # Enable periodic database cleanup.
  #
  # This deletes item history older than keep-days. It now ships OFF, and the switch is the switch:
  # `enabled: false` means the plugin never runs the retention job, whatever `interval-hours` says.
  # (Before, only the interval was read, so an operator who turned cleanup off still lost rows on the
  # next cycle — the opposite of what the file said.) LITE ignores this section entirely and never
  # deletes history.
  #
  # Turning it on is a deliberate choice to trade audit depth for database size: the history rows a
  # restore decision would stand on are exactly the ones it removes.
  auto-cleanup:
    enabled: false
    # Run cleanup every X hours
    interval-hours: 24
    # Delete history entries older than X days
    keep-days: 30

  # Track items in container scans (chest, shulker, etc.)
  container-scan-enabled: true

  # Interval (ticks) between inventory scans for tracked items
  inventory-scan-interval: 600  # 30 seconds at 20 TPS

  # Maximum items to track per player inventory
  max-track-per-player: 500

# ---------- WORLD MANAGEMENT ----------
worlds:
  # List of worlds where tracking is disabled
  # Items in these worlds will not be tagged or tracked
  disabled-worlds: []

  # Enable the legacy WorldGuard allow-policy integration.
  # When enabled, tracking is allowed only when the verified hook query returns
  # permission 'itemguard.track'; unavailable/error states deny fail-closed.
  # Keep disabled until the deployed WorldGuard version/API is validated.
  worldguard-support: false

# ---------- DISCORD WEBHOOK ----------
discord:
  # Enable Discord webhook notifications
  enabled: false

  # Discord webhook URL
  # Get this from Discord server settings > Integrations > Webhooks
  webhook-url: ""

  # Bot/Username shown in Discord
  username: "ItemGuard Alerts"

  # Bot avatar URL (optional)
  avatar-url: ""
